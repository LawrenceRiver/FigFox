<title id="cover-title">FigFox — Scientific figures, made editable.</title><desc id="cover-desc">Native SVG reconstruction of the FigFox Generate cover. Two illustrative corresponding diagrams represent a scientific source and editable SVG; the output circle has selection handles. No experimental result is depicted.</desc>
